<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteMap - Dashboard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/src/css/dashboard.css" />
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <a href="/pages/dashboard.html" class="brand">
          <img src="/assets/logo.png" alt="BiteMap" class="logo-img" />
          <span class="brand-name">Bite<strong>Map</strong></span>
        </a>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
          </a>
          <a href="/pages/explore.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            Explore
          </a>
          <a href="/pages/friends.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Friends
          </a>
          <a href="/pages/profile.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profile
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="user-card-header">
            <img id="sidebar-avatar" src="https://ui-avatars.com/api/?name=...&background=ea7a2b&color=fff&size=96&bold=true" alt="User Avatar" class="user-avatar" />
            <div class="user-info">
              <div class="user-name" id="sidebar-name">Loading...</div>
              <div class="user-title" id="sidebar-title">Level 1</div>
            </div>
          </div>
          <div class="level-info" id="sidebar-level-info">
            <span class="level-label" id="sidebar-level-label">LEVEL 1</span>
            <span class="level-percent" id="sidebar-level-pct">0% TO LEVEL 2</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="sidebar-progress-fill" style="width: 0%"></div>
          </div>
          <div class="xp-text" id="sidebar-xp-text">0 XP to next rank</div>
        </div>

        <a href="/pages/profile.html" class="btn btn-profile" style="text-decoration: none;">View Profile</a>
        <button class="btn btn-logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      
      <!-- Dashboard Sections -->
      <div class="content-body">
        
        <!-- Recommended Section -->
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Recommended for You</h2>
            <a href="/pages/explore.html" class="see-all" id="recommended-see-all">See all matches</a>
          </div>

          <!-- Dynamically populated by dashboard.js -->
          <div class="cards-grid" id="recommended-grid">
            <!-- skeleton inserted by JS -->
          </div>
        </section>

        <!-- Recent Activity Section -->
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Recent Activity from Friends</h2>
            <button class="more-opts-btn">•••</button>
          </div>

          <!-- Dynamically populated by dashboard.js -->
          <div class="activity-feed" id="activity-feed">
            <!-- skeleton inserted by JS -->
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="/src/js/supabase.js"></script>
  <script type="module" src="/src/js/auth.js"></script>
  <script type="module" src="/src/js/dashboard.js"></script>
</body>
</html>
