<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteMap - Find Friends</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/friends.css" />
</head>

<body>

  <div class="dashboard-layout">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <a href="dashboard.html" class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
                fill="white" />
            </svg>
          </div>
          <span class="brand-name">Bite<strong>Map</strong></span>
        </a>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
            Home
          </a>
          <a href="explore.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
            </svg>
            Explore
          </a>
          <a href="friends.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Friends
          </a>
          <a href="profile.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="user-card-header">
            <img id="sidebar-avatar"
              src="https://ui-avatars.com/api/?name=User&background=ea7a2b&color=fff&size=88&bold=true"
              alt="User Avatar" class="user-avatar" />
            <div class="user-info">
              <div class="user-name" id="sidebar-name">Loading…</div>
              <div class="user-title" id="sidebar-handle">@user</div>
            </div>
          </div>
        </div>

        <a href="profile.html" class="btn btn-profile" style="text-decoration:none;">View Profile</a>
        <button class="btn btn-logout" id="logout-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- ─── MAIN CONTENT ─── -->
    <main class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <div></div>
        <div class="topbar-actions">
          <button class="icon-btn" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>
          <button class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <img id="topbar-avatar"
            src="https://ui-avatars.com/api/?name=User&background=ea7a2b&color=fff&size=88&bold=true" alt="Profile"
            class="header-avatar" />
        </div>
      </header>

      <!-- Scrollable content body -->
      <div class="content-body" style="display:flex; flex-direction:column;">

        <!-- Page Title + Search -->
        <div class="friends-header">
          <h1 class="friends-title">Find Foodie Friends</h1>

          <div class="friends-search-wrapper">
            <svg class="friends-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="friends-search-input" placeholder="Search by name, handle, or favorite food..."
              autocomplete="off" />
            <button class="friends-search-btn" id="friends-search-btn">Search</button>
          </div>
        </div>

        <!-- Your Friends Section -->
        <section class="friends-section" id="your-friends-section" style="display: none;">
          <div class="friends-section-header">
            <h2 class="friends-section-title">Your Foodie Friends</h2>
            <a href="#" class="friends-view-all">View All</a>
          </div>
          <div class="suggested-grid" id="your-friends-grid">
            <div class="friends-loading">Loading your friends…</div>
          </div>
        </section>

        <!-- Suggested Friends Section -->
        <section class="friends-section">
          <div class="friends-section-header">
            <h2 class="friends-section-title" id="suggested-title">Suggested Friends</h2>
            <a href="#" class="friends-view-all" id="view-all-btn">View All</a>
          </div>
          <div class="suggested-grid" id="suggested-grid">
            <div class="friends-loading">Loading suggestions…</div>
          </div>
        </section>



      </div><!-- /content-body -->
    </main>
  </div>

  <script type="module" src="js/friends.js"></script>
</body>

</html>
